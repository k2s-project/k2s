apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-small-cpu
  namespace: kserve-models-cpu
  labels:
    app.kubernetes.io/managed-by: k2s-kserve
  annotations:
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/autoscalerClass: external
spec:
  predictor:
    serviceAccountName: model-server
    minReplicas: 1
    maxReplicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    model:
      runtime: k2s-llama-cpp-cpu
      modelFormat:
        name: gguf
      storageUri: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf
      args:
        - --model
        - /mnt/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        - --ctx-size
        - "2048"
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 2Gi
