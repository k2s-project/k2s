# NOTE: This file is a copy of ../configmap.yaml with ONLY the [OUTPUT] section changed to 'stdout'
# and Log_Level changed to 'info'. If you modify [INPUT] or [FILTER] sections in ../configmap.yaml,
# mirror those changes here to avoid drift.

---
# Source: fluent-bit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    helm.sh/chart: fluent-bit-0.58.3
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/version: "5.1.5"
    app.kubernetes.io/managed-by: Helm
data:
  custom_parsers.conf: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
    
    [PARSER]
        Name syslog-rfc3164-nopri
        Format regex
        Regex /^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
        Time_Key time
        Time_Format %b %d %H:%M:%S
        Time_Keep Off
        Time_Offset +0200
    
  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /var/log/flb-storage
        storage.sync normal
        storage.backlog.mem_limit 15M
        storage.metrics on

    [INPUT]
        name opentelemetry
        listen 0.0.0.0
        port 4318
        Tag otel.*
    
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/*_logging_*.log
        Parser cri
        Tag kube.*
        Read_from_Head true
        Buffer_Chunk_Size 256KB
        Buffer_Max_Size 2MB
        Mem_Buf_Limit 50MB
        storage.type filesystem
        Refresh_Interval 5

    [INPUT]
        Name tail
        Path /var/log/syslog
        Parser syslog-rfc3164-nopri
        Tag syslog.*
        Read_from_Head true
        Buffer_Chunk_Size 256KB
        Buffer_Max_Size 2MB
        Mem_Buf_Limit 10MB
        storage.type filesystem
        Refresh_Interval 5

    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        K8S-Logging.Parser Off
        K8S-Logging.Exclude Off
        Buffer_Size 1MB
    
    [FILTER]
        Name nest
        Match kube.*
        Operation lift
        Nested_under kubernetes
    
    [FILTER]
        Name modify
        Match kube.*
        Rename message log
        Rename pod_name k2s.pod.name
        Rename namespace_name k2s.namespace.name
        Rename host k2s.host.name
        Remove container_image
        Remove docker_id
        Remove container_name
        Remove pod_id
        Remove annotations
        Remove labels
        Remove time
        Remove logtag
        Remove container_hash

    [FILTER]
        Name modify
        Match syslog.*
        Rename message log
        Rename host k2s.host.name

    [FILTER]
        Name     throttle
        Match    *
        Rate     800
        Window   3
        Print_Status  true
        Interval 30s
    
    [OUTPUT]
        Name  stdout
        Match *
        Format json
