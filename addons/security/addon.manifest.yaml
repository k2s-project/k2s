apiVersion: v1
kind: AddonManifest
metadata:
  name: security
  description: 'Enables secure communication into and inside the cluster'
spec:
  implementations:
    - name: security
      description: 'Enables secure communication into and inside the cluster'
      offline_usage:
        linux:
          repos: []
          deb: []
          curl: []
          additionalImages:
            - registry.k8s.io/external-dns/external-dns
            - quay.io/jetstack/cert-manager-cainjector
            - quay.io/jetstack/cert-manager-controller
            - quay.io/jetstack/cert-manager-webhook
            - cr.l5d.io/linkerd/controller:edge-26.6.3
            - shsk2s.azurecr.io/linkerd/proxy:edge-26.6.3
            - reg.kyverno.io/kyverno/kyverno:v1.19.2
            - reg.kyverno.io/kyverno/kyvernopre:v1.19.2
            - reg.kyverno.io/kyverno/background-controller:v1.19.2
            - reg.kyverno.io/kyverno/cleanup-controller:v1.19.2
            - reg.kyverno.io/kyverno/reports-controller:v1.19.2
            - reg.kyverno.io/kyverno/kyverno-cli:v1.19.2
          additionalImagesFiles:
            - ../common/manifests/external-dns/deployment.yaml
            - ../common/manifests/certmanager/cert-manager.yaml
        windows:
          additionalImages:
            - shsk2s.azurecr.io/linkerd/proxy:edge-26.6.3
          curl:
            - url: https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_windows_amd64.exe
              destination: bin\cmctl.exe
            - url: https://github.com/kyverno/kyverno/releases/download/v1.19.2/kyverno-cli_v1.19.2_windows_x86_64.zip
              destination: bin\kyverno.exe
            - url: https://github.com/linkerd/linkerd2/releases/download/edge-26.6.3/linkerd2-cli-edge-26.6.3-windows.exe
              destination: bin\linkerd.exe
      commands:
        enable:
          cli:
            flags:
              - name: ingress
                shorthand: i
                default: nginx
                description: Ingress controller to use for exposing security
                constraints:
                  kind: validation-set
                  validationSet:
                    - nginx
                    - traefik
                    - nginx-gw
              - name: type
                shorthand: t
                default: basic
                description: Type of security (basic->trust level cluster, enhanced->zero trust)
                constraints:
                  kind: validation-set
                  validationSet:
                    - basic
                    - enhanced
              - name: omitHydra
                description: Omit hydra and login implementation
                type: boolean
                default: false
                omittedImages:
                  fromFiles:
                    - manifests/keycloak/windowsprovider/hydra.yaml
                    - manifests/keycloak/windowsprovider/windows-login.yaml
              - name: omitKeycloak
                description: Omit keycloak and use external oauth2 provider
                type: boolean
                default: false
                omittedImages:
                  fromFiles:
                    - manifests/keycloak/keycloak.yaml
                    - manifests/keycloak/keycloak-postgres.yaml
              - name: omitOAuth2Proxy
                description: Omit OAuth2 proxy deployment
                type: boolean
                default: false
                omittedImages:
                  fromFiles:
                    - manifests/keycloak/oauth2-proxy.yaml
                    - manifests/hydra/oauth2-proxy-hydra.yaml
              - name: omitPolicyEnf
                description: Omit Kyverno policy enforcement engine
                type: boolean
                default: false
                # Kyverno is installed from manifests/kyverno/kyverno-*.tgz and its
                # values.yaml does not override the image coordinates, so the images
                # cannot be discovered from a manifest file. Keep this list in sync with
                # offline_usage.linux.additionalImages above.
                omittedImages:
                  explicit:
                    - reg.kyverno.io/kyverno/kyverno:v1.19.0
                    - reg.kyverno.io/kyverno/kyvernopre:v1.19.0
                    - reg.kyverno.io/kyverno/background-controller:v1.19.0
                    - reg.kyverno.io/kyverno/cleanup-controller:v1.19.0
                    - reg.kyverno.io/kyverno/reports-controller:v1.19.0
                    - reg.kyverno.io/kyverno/kyverno-cli:v1.19.0
            examples:
              - cmd: k2s addons enable security
                comment: Enable security addon with CA issuer configured
              - cmd: k2s addons enable security --type enhanced
                comment: Enable security addon with zero trust settings
              - cmd: k2s addons enable security --omitHydra
                comment: Enable security addon and omit hydra/login setup
              - cmd: k2s addons enable security --omitKeycloak
                comment: Enable security addon and omit keycloak setup
              - cmd: k2s addons enable security --omitHydra --omitKeycloak
                comment: Enable security addon and omit both hydra/login and keycloak setup
              - cmd: k2s addons enable security --omitOAuth2Proxy
                comment: Enable security addon and omit OAuth2 proxy setup
              - cmd: k2s addons enable security --omitHydra --omitKeycloak --omitOAuth2Proxy
                comment: Enable security addon and omit hydra/login, keycloak, and OAuth2 proxy setup
              - cmd: k2s addons enable security --omitPolicyEnf
                comment: Enable security addon and omit Kyverno policy enforcement engine
          script:
            subPath: Enable.ps1
            parameterMappings:
              - cliFlagName: ingress
                scriptParameterName: Ingress
              - cliFlagName: type
                scriptParameterName: Type
              - cliFlagName: omitHydra
                scriptParameterName: OmitHydra
              - cliFlagName: omitKeycloak
                scriptParameterName: OmitKeycloak
              - cliFlagName: omitOAuth2Proxy
                scriptParameterName: OmitOAuth2Proxy
              - cliFlagName: omitPolicyEnf
                scriptParameterName: OmitPolicyEnf
        disable:
          cli:
            examples:
              - cmd: k2s addons disable security
                comment: Disable addon security in K2s
          script:
            subPath: Disable.ps1
