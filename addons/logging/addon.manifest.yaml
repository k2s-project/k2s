apiVersion: v1
kind: AddonManifest
metadata:
  name: logging
  description: Dashboard for Kubernetes container logs
spec:
  implementations:
    - name: logging
      description: Dashboard for Kubernetes container logs
      commands:
        enable:
          cli:
            flags:
              - name: infra-node-selector
                default: ""
                description: Hard node selector for OpenSearch services, excluding Fluent Bit node agents
              - name: ingress
                default: none
                description: Ingress controller to use for exposing logging dashboards
                constraints:
                  kind: validation-set
                  validationSet:
                    - none
                    - nginx
                    - nginx-gw
                    - traefik
              - name: omitOpensearch
                description: Deploy only Fluent-bit; omit OpenSearch and OpenSearch Dashboards
                default: false
                omittedImages:
                  fromFiles:
                    - manifests/logging/opensearch/statefulset.yaml
                    - manifests/logging/opensearch-dashboards/deployment.yaml
              - name: snode
                shorthand: s
                default: ""
                description: Node to use for persistent volume storage (defaults to control-plane)
            examples:
              - cmd: k2s addons enable logging
              - cmd: k2s addons enable logging --snode worker1
                comment: Enable logging in k2s
              - cmd: k2s addons enable logging --infra-node-selector kubernetes.io/hostname=kubemaster --ingress none --snode kubemaster
                comment: Windows host only; run OpenSearch services on kubemaster with compatible existing PV storage; Fluent Bit remains distributed; no data migration
              - cmd: k2s addons enable logging --ingress traefik
                comment: Enable logging in k2s with ingress traefik
              - cmd: k2s addons enable logging --omitOpensearch
                comment: Enable logging in k2s without OpenSearch (Fluent-bit stdout output only)
          script:
            subPath: Enable.ps1
            parameterMappings:
              - cliFlagName: infra-node-selector
                scriptParameterName: InfraNodeSelector
              - cliFlagName: snode
                scriptParameterName: StorageNode
              - cliFlagName: ingress
                scriptParameterName: Ingress
              - cliFlagName: omitOpensearch
                scriptParameterName: OmitOpensearch
        disable:
          cli:
            examples:
              - cmd: k2s addons disable logging
                comment: Disable addon logging in k2s
          script:
            subPath: Disable.ps1
