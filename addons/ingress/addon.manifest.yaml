apiVersion: v1
kind: AddonManifest
metadata:
  name: ingress
  description: Ingress Controller for external access
spec:
  implementations:
    - name: nginx
      description: Ingress Controller for external access that uses nginx as a reverse proxy
      offline_usage:
        linux:
          repos: []
          deb: []
          curl: []
          additionalImages:
            - registry.k8s.io/external-dns/external-dns
            - quay.io/jetstack/cert-manager-cainjector
            - quay.io/jetstack/cert-manager-controller
            - quay.io/jetstack/cert-manager-webhook
          additionalImagesFiles:
            - ../../common/manifests/external-dns/deployment.yaml
            - ../../common/manifests/certmanager/cert-manager.yaml
        windows:
          curl:
            - url: https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_windows_amd64.exe
              destination: bin\cmctl.exe
      commands:
        enable:
          cli:
            flags:
              - name: omitCertMgr
                description: Omit cert-manager installation
                default: false
                omittedImages:
                  fromFiles:
                    - ../../common/manifests/certmanager/cert-manager.yaml
            examples:
              - cmd: k2s addons enable ingress nginx
                comment: Enable ingress nginx in k2s
              - cmd: k2s addons enable ingress nginx --omitCertMgr
                comment: Enable ingress nginx without installing cert-manager
          script:
            subPath: nginx/Enable.ps1
            parameterMappings:
              - cliFlagName: omitCertMgr
                scriptParameterName: OmitCertMgr
        disable:
          cli:
            examples:
              - cmd: k2s addons disable ingress nginx
                comment: Disable addon ingress nginx in k2s
          script:
            subPath: nginx/Disable.ps1
    - name: traefik
      description: Ingress Controller for external access that uses traefik as a reverse proxy
      offline_usage:
        linux:
          repos: []
          deb: []
          curl: []
          additionalImages:
            - registry.k8s.io/external-dns/external-dns
            - quay.io/jetstack/cert-manager-cainjector
            - quay.io/jetstack/cert-manager-controller
            - quay.io/jetstack/cert-manager-webhook
          additionalImagesFiles:
            - ../../common/manifests/external-dns/deployment.yaml
            - ../../common/manifests/certmanager/cert-manager.yaml
        windows:
          curl: 
            - url: https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_windows_amd64.exe
              destination: bin\cmctl.exe
      commands:
        enable:
          cli:
            flags:
              - name: omitCertMgr
                description: Omit cert-manager installation
                default: false
                omittedImages:
                  fromFiles:
                    - ../../common/manifests/certmanager/cert-manager.yaml
            examples:
              - cmd: k2s addons enable ingress traefik
                comment: Enable ingress traefik in k2s
              - cmd: k2s addons enable ingress traefik --omitCertMgr
                comment: Enable ingress traefik without installing cert-manager
          script:
            subPath: traefik/Enable.ps1
            parameterMappings:
              - cliFlagName: omitCertMgr
                scriptParameterName: OmitCertMgr
        disable:
          cli:
            examples:
              - cmd: k2s addons disable ingress traefik
                comment: Disable addon ingress traefik in k2s
          script:
            subPath: traefik/Disable.ps1
    - name: nginx-gw
      description: Ingress Controller for external access that uses NGINX Gateway Fabric
      offline_usage:
        linux:
          repos: []
          deb: []
          curl: []
          additionalImages:
          - registry.k8s.io/external-dns/external-dns
          - quay.io/jetstack/cert-manager-cainjector
          - quay.io/jetstack/cert-manager-controller
          - quay.io/jetstack/cert-manager-webhook
          - ghcr.io/nginx/nginx-gateway-fabric/nginx:2.8.0
          additionalImagesFiles:
          - ../../common/manifests/external-dns/deployment.yaml
          - ../../common/manifests/certmanager/cert-manager.yaml
        windows:
          curl:
            - url: https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_windows_amd64.exe
              destination: bin\cmctl.exe
      commands:
        enable:
          cli:
            flags:
              - name: omitCertMgr
                description: Omit cert-manager installation (TLS certificates must be provided manually)
                default: false
                omittedImages:
                  fromFiles:
                    - ../../common/manifests/certmanager/cert-manager.yaml
            examples:
              - cmd: k2s addons enable ingress nginx-gw
                comment: Enable ingress nginx-gw in k2s
              - cmd: k2s addons enable ingress nginx-gw --omitCertMgr
                comment: Enable ingress nginx-gw without installing cert-manager
          script:
            subPath: nginx-gw/Enable.ps1
            parameterMappings:
              - cliFlagName: omitCertMgr
                scriptParameterName: OmitCertMgr
        disable:
          cli:
            examples:
              - cmd: k2s addons disable ingress nginx-gw
                comment: Disable addon ingress nginx-gw in k2s
          script:
            subPath: nginx-gw/Disable.ps1 
