kind: k2s
apiVersion: v1
nodes:
  - role: control-plane # required
    resources:
      cpu: 6 # default
      memory: 6GB # default startup memory (set to memoryMin if only memoryMin/memoryMax specified, otherwise 6GB)
      memoryMin: # optional, minimum RAM for dynamic memory (auto-enables dynamic memory)
      memoryMax: # optional, maximum RAM for dynamic memory (auto-enables dynamic memory)
      disk: 50GB # default
  - role: worker # optional, managed Windows worker on native Linux hosts
    resources:
      cpu: 4 # default
      memory: 8GB # default startup memory
      disk: 64GB # default
windowsQCOW2Path: # native Linux only; prepared Windows worker QCOW2 image
env:
  httpProxy: # default
  additionalHooksDir: # default
  restartPostInstallCount: # default
installBehavior:
  showOutput: false # default
  deleteFilesForOfflineInstallation: false # default
  forceOnlineInstallation: false # default
  wsl: false # default
  appendLog: false # default
  skipStart: false # default
# Optional role-based kubelet overrides:
# kubeletOverrides:
#   linuxControlPlane:
#     enabled: true
#     config:
#       maxPods: 100
#       systemReserved:
#         cpu: "500m"
#         memory: "1Gi"
#       kubeReserved:
#         cpu: "250m"
#         memory: "512Mi"
#   windowsWorker:
#     enabled: true
#     config:
#       maxPods: 100
#       systemReserved:
#         cpu: "500m"
#         memory: "1Gi"
#       kubeReserved:
#         cpu: "250m"
#         memory: "512Mi"
