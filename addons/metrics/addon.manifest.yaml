apiVersion: v1
kind: AddonManifest
metadata:
  name: metrics
  description: Kubernetes metrics server for API Access to service metrics
spec:
  implementations:
    - name: metrics
      description: Kubernetes metrics server for API Access to service metrics
      offline_usage:
        linux:
          repos: []
          deb: []
          curl: []
          additionalImages: []
          additionalImagesFiles: []
        windows:
          curl: []
          additionalImages:
            - shsk2s.azurecr.io/prometheus-community/windows-exporter
          additionalImagesFiles:
            - ../common/manifests/windows-exporter/daemonset.yaml
      commands:
        enable:
          cli:
            flags:
              - name: infra-node-selector
                default: ""
                description: Constrain the metrics-server Pod to nodes matching all label requirements
            examples:
              - cmd: k2s addons enable metrics
                comment: Enable metrics in k2s
              - cmd: k2s addons enable metrics --infra-node-selector kubernetes.io/hostname=kubemaster
                comment: Run metrics-server on kubemaster; node-local Windows Exporter remains distributed
          script:
            subPath: Enable.ps1
            parameterMappings:
              - cliFlagName: infra-node-selector
                scriptParameterName: InfraNodeSelector
        disable:
          cli:
            examples:
              - cmd: k2s addons disable metrics
                comment: Disable addon metrics in k2s
          script:
            subPath: Disable.ps1
