apiVersion: v1
kind: AddonManifest
metadata:
  name: registry
  description: Private image registry running in the Kubernetes cluster exposed on k2s.registry.local
spec:
  implementations:
    - name: registry
      description: Private image registry running in the Kubernetes cluster exposed on k2s.registry.local
      offline_usage:
        linux:
          repos: []
          deb:
            - apache2-utils
          curl: []
          additionalImages: []
        windows:
          curl: []
      commands:
        enable:
          cli:
            flags:
              - name: infra-node-selector
                default: ""
                description: Hard node selector for registry infrastructure compatible with its storage node
              - name: ingress
                shorthand: i
                default: nginx
                description: Ingress controller to use for exposing registry if not already enabled
                constraints:
                  kind: validation-set
                  validationSet:
                    - none
                    - nginx
                    - nginx-gw
                    - traefik
              - name: snode
                shorthand: s
                default: ""
                description: Node to use for persistent volume storage (defaults to control-plane)
            examples:
              - cmd: k2s addons enable registry
                comment: Enable registry in k2s
              - cmd: k2s addons enable registry --infra-node-selector kubernetes.io/hostname=kubemaster --ingress none --snode kubemaster
                comment: Run registry on kubemaster with compatible existing PV storage; no data migration
              - cmd: k2s addons enable registry --snode worker1
                comment: Enable registry with storage on worker1
              - cmd: k2s addons enable registry --ingress traefik
                comment: Enable addon registry in k2s with traefik ingress controller
          script:
            subPath: Enable.ps1
            parameterMappings:
              - cliFlagName: infra-node-selector
                scriptParameterName: InfraNodeSelector
              - cliFlagName: snode
                scriptParameterName: StorageNode
              - cliFlagName: ingress
                scriptParameterName: Ingress
        disable:
          cli:
            flags:
              - name: delete-images
                shorthand: d
                default: false
                description: Delete local image storage
            examples:
              - cmd: k2s addons disable registry
                comment: Disable addon registry in k2s
              - cmd: k2s addons disable registry --delete-images
                comment: Disable addon registry in k2s and delete local images
          script:
            subPath: Disable.ps1
            parameterMappings:
              - cliFlagName: delete-images
                scriptParameterName: DeleteImages
