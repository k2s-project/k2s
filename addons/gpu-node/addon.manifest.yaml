apiVersion: v1
kind: AddonManifest
metadata:
  name: gpu-node
  description: Configure GPU-capable cluster nodes for direct GPU access and high-performance workloads (control plane or selected Linux workers).
spec:
  implementations:
    - name: gpu-node
      description: Configure GPU-capable cluster nodes for direct GPU access and high-performance workloads (control plane or selected Linux workers).
      offline_usage:
        linux:
          repos:
            - curl --retry 3 --retry-all-errors -fsSL https://nvidia.github.io/libnvidia-container/gpgkey -x __LOCAL_HTTP_PROXY__ | sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg && curl --retry 3 --retry-all-errors -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list -x __LOCAL_HTTP_PROXY__ | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
          deb:
            - libnvidia-container1
            - libnvidia-container-tools
            - nvidia-container-runtime
            - nvidia-container-toolkit
          curl: []
          additionalImages:
            - shsk2s.azurecr.io/microsoft-standard-wsl2:6.18.58.1
            - nvcr.io/nvidia/k8s-device-plugin:v0.20.1
            - nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubi9
        windows:
          curl: []
      commands:
        enable:
          cli:
            flags:
              - name: time-slices
                shorthand: t
                default: "1"
                description: "Number of time-slicing replicas per GPU. 1 = exclusive access (default). Set >1 to share the GPU across multiple pods simultaneously (e.g. 4 = up to 4 pods share one physical GPU via CUDA time-slicing)."
              - name: node
                shorthand: n
                default: ""
                description: "Optional comma-separated list of cluster nodes to label as GPU nodes for this addon run."
            examples:
              - cmd: k2s addons enable gpu-node
                comment: Enable gpu-node in k2s (exclusive GPU access per pod)
              - cmd: k2s addons enable gpu-node --time-slices 4
                comment: Enable gpu-node with 4-way GPU time-slicing (up to 4 pods share the GPU simultaneously)
              - cmd: k2s addons enable gpu-node --node "my-gpu-worker, my-other-gpu-worker, kubemaster"
                comment: Enable gpu-node only for the specified cluster nodes.
          script:
            subPath: Enable.ps1
            parameterMappings:
              - cliFlagName: time-slices
                scriptParameterName: TimeSlices
              - cliFlagName: node
                scriptParameterName: Node
        disable:
          cli:
            examples:
              - cmd: k2s addons disable gpu-node
                comment: Disable addon gpu-node in k2s
          script:
            subPath: Disable.ps1
