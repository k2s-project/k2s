#
# Collects cluster state, the K2s log and the guest consoles, stops the guests and uploads the diagnostics.
# Call it with 'if: always()' so failed runs keep their diagnostics. The env script defines cp_vm and wk_vm.

name: Linux cluster diagnostics
description: Collects diagnostics from the guests, stops them and uploads the result.

inputs:
  env-script:
    description: Script that defines cp_vm and wk_vm, e.g. .github/scripts/linux-cluster-amd64-env.sh.
    required: true
  artifact-name:
    description: Name of the uploaded diagnostics artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Collect diagnostics (control plane and worker)
      shell: bash
      env:
        ENV_SCRIPT: ${{ inputs.env-script }}
      run: |
        set -uo pipefail
        source "$ENV_SCRIPT"
        out="$RUNNER_TEMP/k2s-results-export"
        mkdir -p "$out"
        cp_vm exec <<'EOF' || true
        set -uo pipefail
        sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes -o wide > ~/cluster-nodes.txt 2>&1
        sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get pods -A -o wide > ~/cluster-pods.txt 2>&1
        sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get events -A --sort-by=.lastTimestamp > ~/cluster-events.txt 2>&1
        sudo cat /var/log/k2s.log > ~/k2s.log 2>/dev/null || true
        EOF
        cp_vm pull '~/cluster-*.txt' "$out" || true
        cp_vm pull '~/k2s.log' "$out" || true
        cp "$CP_VM_DIR/console.log" "$out/control-plane-console.log" 2>/dev/null || true
        cp "$WK_VM_DIR/console.log" "$out/worker-console.log" 2>/dev/null || true

    - name: Stop guests
      shell: bash
      env:
        ENV_SCRIPT: ${{ inputs.env-script }}
      run: |
        source "$ENV_SCRIPT"
        cp_vm stop || true
        wk_vm stop || true

    - name: Upload diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/k2s-results-export/
        if-no-files-found: warn
        retention-days: 7
