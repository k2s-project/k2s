  router: "{\n    \"image\" : \"docker.io/kserve/router:v0.21.0\",\n    \"memoryRequest\": \"100Mi\",\n    \"memoryLimit\": \"1Gi\",\n    \"cpuRequest\": \"100m\",\n    \"cpuLimit\": \"1\",\n    \"imagePullPolicy\": \"IfNotPresent\"\n}"
