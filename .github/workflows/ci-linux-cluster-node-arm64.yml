#
# Linux-host cluster with an arm64 worker node, on two GitHub-hosted runners.
#
# - Job 'arm64-node-package' builds the arm64 node package (ci-arm64-node-package-build.yml, native arm64).
# - Job 'control-plane' (ubuntu-24.04, amd64): a Debian 13 amd64 guest with KVM, 4 GB RAM. K2s is installed
#   with --linux-only (same setup as ci-linux-cluster.yml), then 'k2s node add' joins the worker.
# - Job 'arm64-worker' (ubuntu-24.04-arm): a Debian 13 arm64 guest, 2 GB RAM, under QEMU TCG (no KVM).
#
# Both guests sit on the subnet 10.10.0.0/24. The two runners connect their bridges with a VXLAN device over
# Tailscale (tag:k2s-ci, as in ci-arm64-node-join.yml), so the worker is in the control plane's subnet.
# The jobs hand over artifacts: the K2s public key (control plane -> worker) and the readiness and completion
# markers (worker <-> control plane). Each job finds the other runner on the tailnet by a hostname that
# contains the run id and attempt.
#
# The arm64 package is built without GPU packages: the worker has no GPU and the test does not need them.

name: CI - Linux Cluster with arm64 Node

on:
  workflow_dispatch:
    inputs:
      kvm_attempt:
        description: 'Internal: attempt number when this run was re-dispatched to find a runner with KVM. Leave at 1.'
        type: number
        required: false
        default: 1

permissions:
  contents: read

concurrency:
  group: k2s-linux-cluster-node-arm64
  cancel-in-progress: false

jobs:
  arm64-node-package:
    name: Build the arm64 node package
    uses: ./.github/workflows/ci-arm64-node-package-build.yml
    with:
      include_gpu: false

  control-plane:
    name: Control plane (amd64 guest) and node add
    needs: arm64-node-package
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
      id-token: none
    defaults:
      run:
        shell: bash
    env:
      KVM_MAX_ATTEMPTS: 5
      CP_TAILSCALE_HOST: k2s-cp-${{ github.run_id }}-${{ github.run_attempt }}
      WK_TAILSCALE_HOST: k2s-arm64-worker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Check KVM (re-dispatch on a new runner if missing)
        id: kvm
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KVM_ATTEMPT: ${{ inputs.kvm_attempt }}
        run: |
          set -uo pipefail
          echo "KVM attempt ${KVM_ATTEMPT} of ${KVM_MAX_ATTEMPTS}"
          uname -m | grep -qx x86_64 || { echo "::error::Runner is not amd64: $(uname -m)"; exit 1; }
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "/dev/kvm does not exist on this runner"
          fi
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is usable on this runner."
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$KVM_ATTEMPT" -ge "$KVM_MAX_ATTEMPTS" ]; then
            echo "::error::No usable /dev/kvm after ${KVM_ATTEMPT} attempts; giving up."
            exit 1
          fi
          next=$((KVM_ATTEMPT + 1))
          echo "::notice::No usable /dev/kvm on this runner. Re-dispatching attempt ${next} of ${KVM_MAX_ATTEMPTS} on a new runner."
          gh workflow run ci-linux-cluster-node-arm64.yml --ref "$GITHUB_REF_NAME" -f kvm_attempt="$next"
          echo "Re-dispatched attempt ${next}. This run ends without installing K2s; see the new run." >> "$GITHUB_STEP_SUMMARY"

      - name: Join Tailscale (overlay network to the worker runner)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: tailscale/github-action@v3
        timeout-minutes: 10
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:k2s-ci
          hostname: ${{ env.CP_TAILSCALE_HOST }}

      - name: Find the worker runner on the tailnet
        id: overlay
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          local_ip="$(tailscale ip -4 | head -n 1)"
          peer_ip=""
          for attempt in $(seq 1 60); do
            peer_ip="$(tailscale_peer_ip "$WK_TAILSCALE_HOST")"
            [ -n "$peer_ip" ] && break
            sleep 10
          done
          test -n "$peer_ip" || { echo "::error::worker runner $WK_TAILSCALE_HOST is not on the tailnet"; exit 1; }
          echo "VM_OVERLAY_LOCAL=$local_ip" >> "$GITHUB_ENV"
          echo "VM_OVERLAY_PEER=$peer_ip" >> "$GITHUB_ENV"
          echo "Overlay: this runner $local_ip, worker runner $peer_ip"

      - name: Free runner disk space for the guest image
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Go
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Build K2s executables (linux/amd64)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash build.sh
          for binary in k2s bin/httpproxy bin/dnsproxy bin/cloudinitisobuilder bin/yaml2json; do
            test -x "$binary" || { echo "::error::Build did not produce $binary"; exit 1; }
          done
          file k2s | grep -q 'ELF 64-bit' || { echo "::error::k2s is not a linux/amd64 ELF binary"; exit 1; }

      - name: Download the arm64 node package
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: debian13-arm64-node-package
          path: ${{ runner.temp }}/node-package

      - name: Start control-plane guest (amd64, KVM, 4 GB)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          cp_vm prepare
          cp_vm start
          cp_vm wait-ssh

      - name: Prepare control-plane guest (Go toolchain and source tree)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          go_version=$(awk '/^go /{print $2}' go.mod)
          {
            printf 'GO_VERSION=%q\n' "$go_version"
            cat <<'EOF'
          cloud-init status --wait || echo 'cloud-init reported errors; continuing'
          if [ ! -x /usr/local/go/bin/go ]; then
            curl -fsSL --retry 3 "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          fi
          /usr/local/go/bin/go version
          EOF
          } | cp_vm exec
          tar --exclude=.git -czf "$RUNNER_TEMP/k2s-src.tgz" .
          cp_vm push "$RUNNER_TEMP/k2s-src.tgz" k2s-src.tgz
          cp_vm exec <<'EOF'
          set -euo pipefail
          mkdir -p ~/k2s
          tar -xzf ~/k2s-src.tgz -C ~/k2s
          test -x ~/k2s/k2s
          EOF

      - name: Install K2s on the control plane (Linux host, linux-only)
        id: install
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          {
            printf 'cd ~/k2s\n'
            printf 'sudo ./k2s install --linux-only --output\n'
          } | cp_vm exec

      - name: Verify control plane and system pods
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          cp_vm exec <<'EOF'
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s status --output wide
          command -v kubectl >/dev/null || { echo 'kubectl is not on PATH for the guest user'; exit 1; }
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          EOF

      - name: Export the K2s public key
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          mkdir -p "$RUNNER_TEMP/cp-pubkey"
          cp_vm exec <<'EOF' > "$RUNNER_TEMP/cp-pubkey/k2s-node.pub"
          set -euo pipefail
          sudo test -f /root/.ssh/k2s/id_ed25519.pub
          sudo cat /root/.ssh/k2s/id_ed25519.pub
          EOF
          grep -q '^ssh-ed25519 ' "$RUNNER_TEMP/cp-pubkey/k2s-node.pub"

      - name: Hand the K2s public key to the worker runner
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: cp-pubkey-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cp-pubkey
          retention-days: 1

      - name: Wait for the worker to authorize the K2s key and report ready
        id: worker_ready
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 13800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if gh run download "$GITHUB_RUN_ID" -n "worker-ready-${GITHUB_RUN_ATTEMPT}" --dir "$RUNNER_TEMP/worker-ready" >/dev/null 2>&1; then
              echo "Worker is ready."
              exit 0
            fi
            sleep 30
          done
          echo "::error::the worker runner did not report ready"
          exit 1

      - name: Copy the node package to the control plane
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          zip_path="$(find "$RUNNER_TEMP/node-package" -maxdepth 1 -name 'k2s-*-node-debian13-arm64.zip' | head -n 1)"
          test -n "$zip_path" || { echo '::error::arm64 node package not found in the artifact'; exit 1; }
          echo "Node package: $(basename "$zip_path") ($(du -h "$zip_path" | cut -f1))"
          cp_vm push "$zip_path" node-package.zip

      - name: Add the arm64 worker with k2s node add
        id: add
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          cp_vm exec <<EOF
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s node add --ip-addr $WK_IP --username debian --node-package /home/debian/node-package.zip
          EOF

      - name: Check the arm64 node joined and runs workloads
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          cp_vm exec <<'EOF'
          set -euo pipefail
          export KUBECONFIG=/etc/kubernetes/admin.conf
          kube() { sudo env KUBECONFIG="$KUBECONFIG" kubectl "$@"; }

          kube wait --for=condition=Ready nodes --all --timeout=900s

          arm_node="$(kube get nodes -l kubernetes.io/arch=arm64 -o jsonpath='{.items[0].metadata.name}')"
          test -n "$arm_node" || { echo '::error::no node with kubernetes.io/arch=arm64'; exit 1; }
          echo "arm64 node: $arm_node"

          # Flannel and kube-proxy must run on the arm64 node for pod networking to work there.
          running=0
          for attempt in $(seq 1 40); do
            running="$(kube get pods -A --field-selector "spec.nodeName=$arm_node" --no-headers | awk '$4=="Running"' | wc -l)"
            if [ "$running" -ge 2 ]; then break; fi
            sleep 15
          done
          test "$running" -ge 2 || { echo "::error::expected flannel and kube-proxy running on $arm_node, found $running running pods"; kube get pods -A -o wide; exit 1; }

          # An arm64 workload must run on the worker and report its architecture.
          kube run arm64-smoke --image=docker.io/library/busybox:1.37 --restart=Never \
            --overrides='{"spec":{"nodeSelector":{"kubernetes.io/arch":"arm64"}}}' -- sh -c 'uname -m; sleep 5'
          kube wait --for=jsonpath='{.status.phase}'=Succeeded pod/arm64-smoke --timeout=900s
          test "$(kube get pod arm64-smoke -o jsonpath='{.spec.nodeName}')" = "$arm_node"
          kube logs arm64-smoke | grep -qx aarch64 || { echo '::error::workload did not report aarch64'; exit 1; }
          echo "arm64 workload ran on $arm_node as aarch64"
          EOF

      - name: Mark the join as finished for the worker runner
        if: ${{ always() && steps.kvm.outputs.available == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/join-marker"
          echo "node-add=${{ steps.add.outcome }}" > "$RUNNER_TEMP/join-marker/done"

      - name: Tell the worker the join is finished
        if: ${{ always() && steps.kvm.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: join-done-${{ github.run_attempt }}
          path: ${{ runner.temp }}/join-marker
          retention-days: 1

      - name: Collect diagnostics
        if: ${{ always() && steps.kvm.outputs.available == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -uo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          out="$RUNNER_TEMP/k2s-results-export"
          mkdir -p "$out"
          cp_vm exec <<'EOF' || true
          set -uo pipefail
          sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes -o wide > ~/cluster-nodes.txt 2>&1
          sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get pods -A -o wide > ~/cluster-pods.txt 2>&1
          sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get events -A --sort-by=.lastTimestamp > ~/cluster-events.txt 2>&1
          sudo cat /var/log/k2s.log > ~/k2s.log 2>/dev/null || true
          EOF
          cp_vm pull '~/cluster-*.txt' "$out" || true
          cp_vm pull '~/k2s.log' "$out" || true
          cp "$CP_VM_DIR/console.log" "$out/control-plane-console.log" 2>/dev/null || true

      - name: Stop control-plane guest
        if: ${{ always() && steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 5
        run: |
          source .github/scripts/linux-cluster-arm64-env.sh
          cp_vm stop || true

      - name: Upload control-plane diagnostics
        if: ${{ always() && steps.kvm.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: linux-cluster-node-arm64-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k2s-results-export/
          if-no-files-found: warn
          retention-days: 7

  arm64-worker:
    name: Arm64 worker guest (no KVM)
    needs: arm64-node-package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      CP_TAILSCALE_HOST: k2s-cp-${{ github.run_id }}-${{ github.run_attempt }}
      WK_TAILSCALE_HOST: k2s-arm64-worker-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Join Tailscale (overlay network to the control-plane runner)
        uses: tailscale/github-action@v3
        timeout-minutes: 10
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:k2s-ci
          hostname: ${{ env.WK_TAILSCALE_HOST }}

      - name: Find the control-plane runner on the tailnet
        id: overlay
        timeout-minutes: 15
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          local_ip="$(tailscale ip -4 | head -n 1)"
          peer_ip=""
          for attempt in $(seq 1 60); do
            peer_ip="$(tailscale_peer_ip "$CP_TAILSCALE_HOST")"
            [ -n "$peer_ip" ] && break
            sleep 10
          done
          test -n "$peer_ip" || { echo "::error::control-plane runner $CP_TAILSCALE_HOST is not on the tailnet"; exit 1; }
          echo "VM_OVERLAY_LOCAL=$local_ip" >> "$GITHUB_ENV"
          echo "VM_OVERLAY_PEER=$peer_ip" >> "$GITHUB_ENV"
          echo "Overlay: this runner $local_ip, control-plane runner $peer_ip"

      - name: Start worker guest (arm64, TCG, 2 GB)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          wk_vm prepare
          wk_vm start
          wk_vm wait-ssh

      - name: Authorize the K2s public key on the worker
        timeout-minutes: 160
        run: |
          set -euo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          deadline=$((SECONDS + 9000))
          key_file=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if gh run download "$GITHUB_RUN_ID" -n "cp-pubkey-${GITHUB_RUN_ATTEMPT}" --dir "$RUNNER_TEMP/cp-pubkey" >/dev/null 2>&1; then
              key_file="$RUNNER_TEMP/cp-pubkey/k2s-node.pub"
              break
            fi
            sleep 30
          done
          test -n "$key_file" && test -s "$key_file" || { echo "::error::the control plane did not publish its K2s public key"; exit 1; }
          pubkey="$(cat "$key_file")"
          wk_vm exec <<EOF
          set -euo pipefail
          install -d -m 700 ~/.ssh
          grep -qxF '$pubkey' ~/.ssh/authorized_keys 2>/dev/null || echo '$pubkey' >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          EOF

      - name: Report the worker ready
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/worker-marker"
          echo "ready $(date -u +%FT%TZ)" > "$RUNNER_TEMP/worker-marker/ready"

      - name: Hand the worker-ready marker to the control plane
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: worker-ready-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-marker
          retention-days: 1

      - name: Wait for the control plane to finish the join
        timeout-minutes: 340
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 19800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if gh run download "$GITHUB_RUN_ID" -n "join-done-${GITHUB_RUN_ATTEMPT}" --dir "$RUNNER_TEMP/join-done" >/dev/null 2>&1; then
              echo "The control plane finished the join."
              exit 0
            fi
            sleep 60
          done
          echo "::error::timed out waiting for the control plane to finish the join"
          exit 1

      - name: Stop worker guest and collect its console log
        if: ${{ always() }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          source .github/scripts/linux-cluster-arm64-env.sh
          out="$RUNNER_TEMP/k2s-worker-export"
          mkdir -p "$out"
          cp "$WK_VM_DIR/console.log" "$out/worker-console.log" 2>/dev/null || true
          wk_vm stop || true

      - name: Upload worker diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: linux-cluster-node-arm64-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k2s-worker-export/
          if-no-files-found: warn
          retention-days: 7
