# Linux-host counterpart of ci-windows-cluster.yml for the experimental Linux host variant
# (the "reverted setup": control plane runs natively on the host, amd64, Linux-only).
#
# Mirrors ci/tests/40-test-linuxonly.yaml from k2s-support: install with --linux-only, then run
# the sanity-tagged acceptance tests through test/execute_all_tests.sh (the same entry point the
# CI service uses).
#
# K2s' native Linux path requires a Debian 13 host (lib/modules/linux/cluster/lifecycle.sh), and
# GitHub-hosted runners have no Debian host image. The job therefore boots a Debian 13 amd64 KVM
# guest on the GitHub-hosted runner (.github/scripts/linux-cluster-vm.sh) and runs K2s inside it.
#
# GitHub-hosted runners do not always expose /dev/kvm. The first step checks for it and, if it is
# missing, re-dispatches this workflow (new run, new runner) up to KVM_MAX_ATTEMPTS times.
#
# Addon tests are not available on this variant yet. The addon input is kept for parity with the
# Windows workflow; any value other than "none" fails the run before anything is provisioned.

name: CI - Linux Cluster

# Never run untrusted pull-request code on an elevated self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon whose full test set would run after the core suite. Not yet supported on the Linux host; any value other than "none" fails the run.'
        type: choice
        required: true
        default: 'none'
        options:
          - none
          - autoscaling
          - dashboard
          - dicom
          - ingress/nginx-gw
          - ingress/traefik
          - logging
          - metrics
          - monitoring
          - registry
          - rollout/argocd
          - security
          - storage/ceph
          - storage/smb
          - viewer
          - windows-exporter
      kvm_attempt:
        description: 'Internal: attempt number when this run was re-dispatched to find a runner with KVM. Leave at 1.'
        type: number
        required: false
        default: 1

permissions:
  contents: read

concurrency:
  group: k2s-linux-cluster
  cancel-in-progress: false

jobs:
  install-and-test:
    name: Install and test Linux-host cluster (Debian 13 amd64 guest)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write # re-dispatch this workflow when the runner has no usable /dev/kvm
    defaults:
      run:
        shell: bash
    env:
      K2S_CONFIG_HTTP_PROXY: ${{ vars.K2S_HTTP_PROXY }}
      K2S_CONFIG_NO_PROXY: ${{ vars.K2S_NO_PROXY }}
      K2S_ADDON_SELECTION: ${{ inputs.addon }}
      KVM_MAX_ATTEMPTS: 5
      # Invoked through bash: the script is committed without the executable bit.
      VM: bash .github/scripts/linux-cluster-vm.sh
    steps:
      - name: Reject addon selection (not yet supported on Linux host)
        run: |
          set -euo pipefail
          if [ "$K2S_ADDON_SELECTION" != "none" ]; then
            echo "::error::Addon tests ('$K2S_ADDON_SELECTION') are not available on the Linux host variant yet. Re-run with addon=none."
            exit 1
          fi

      - name: Check KVM (re-dispatch on a new runner if missing)
        id: kvm
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KVM_ATTEMPT: ${{ inputs.kvm_attempt }}
        run: |
          set -uo pipefail
          echo "KVM attempt ${KVM_ATTEMPT} of ${KVM_MAX_ATTEMPTS}"
          uname -m | grep -qx x86_64 || { echo "::error::Runner is not amd64: $(uname -m)"; exit 1; }
          echo "cpu vmx/svm flags: $(grep -cE 'vmx|svm' /proc/cpuinfo)"
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "/dev/kvm does not exist on this runner"
          fi
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is usable on this runner."
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$KVM_ATTEMPT" -ge "$KVM_MAX_ATTEMPTS" ]; then
            echo "::error::No usable /dev/kvm after ${KVM_ATTEMPT} attempts; giving up."
            exit 1
          fi
          next=$((KVM_ATTEMPT + 1))
          echo "::notice::No usable /dev/kvm on this runner. Re-dispatching attempt ${next} of ${KVM_MAX_ATTEMPTS} on a new runner."
          gh workflow run ci-linux-cluster.yml --ref "$GITHUB_REF_NAME" \
            -f addon="$K2S_ADDON_SELECTION" -f kvm_attempt="$next"
          echo "Re-dispatched attempt ${next}. This run ends without installing K2s; see the new run." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Free runner disk space for the guest image
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Preinstalled toolchains that this job never uses. Setup-go installs into hostedtoolcache,
          # which is kept.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Go
        if: ${{ steps.kvm.outputs.available == 'true' }}
        uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Build K2s executables (linux/amd64)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Native Linux build: k2s plus the helpers the host install runs from bin/
          # (httpproxy, dnsproxy, cloudinitisobuilder, yaml2json). Building only the CLI
          # makes the install fail in k2s_proxy_install (lib/modules/linux/infra/proxy.sh).
          bash build.sh
          for binary in k2s bin/httpproxy bin/dnsproxy bin/cloudinitisobuilder bin/yaml2json; do
            test -x "$binary" || { echo "::error::Build did not produce $binary"; exit 1; }
          done
          file k2s | grep -q 'ELF 64-bit' || { echo "::error::k2s is not a linux/amd64 ELF binary"; exit 1; }

      - name: Start Debian 13 guest
        id: vm
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          $VM prepare
          $VM start
          $VM wait-ssh

      - name: Prepare guest (Go toolchain and source tree)
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          go_version=$(awk '/^go /{print $2}' go.mod)
          {
            printf 'GO_VERSION=%q\n' "$go_version"
            cat <<'EOF'
          cloud-init status --wait || echo 'cloud-init reported errors; continuing'
          if [ ! -x /usr/local/go/bin/go ]; then
            curl -fsSL --retry 3 "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          fi
          /usr/local/go/bin/go version
          EOF
          } | $VM exec
          tar --exclude=.git -czf "$RUNNER_TEMP/k2s-src.tgz" .
          $VM push "$RUNNER_TEMP/k2s-src.tgz" k2s-src.tgz
          $VM exec <<'EOF'
          set -euo pipefail
          mkdir -p ~/k2s
          tar -xzf ~/k2s-src.tgz -C ~/k2s
          test -x ~/k2s/k2s
          EOF

      - name: Install K2s (Linux host, Linux-only, no Windows worker)
        id: install
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          {
            printf 'cd ~/k2s\n'
            printf 'sudo ./k2s install --linux-only --output'
            if [ -n "${K2S_CONFIG_HTTP_PROXY:-}" ]; then printf ' --proxy %q' "$K2S_CONFIG_HTTP_PROXY"; fi
            if [ -n "${K2S_CONFIG_NO_PROXY:-}" ]; then printf ' --no-proxy %q' "$K2S_CONFIG_NO_PROXY"; fi
            printf '\n'
          } | $VM exec

      - name: Verify node and system pods
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s status --output wide
          command -v kubectl >/dev/null || { echo 'kubectl is not on PATH for the guest user'; exit 1; }
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          node_count=$(kubectl get nodes -o json | jq '.items | length')
          linux_count=$(kubectl get nodes -l kubernetes.io/os=linux -o json | jq '.items | length')
          if [ "$node_count" -ne 1 ] || [ "$linux_count" -ne 1 ]; then
            echo "Expected exactly one Linux node (linux-only install), got $node_count nodes, $linux_count linux."
            exit 1
          fi
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          EOF

      - name: Run sanity acceptance tests (CI service parity)
        id: tests
        if: ${{ steps.kvm.outputs.available == 'true' }}
        timeout-minutes: 100
        run: |
          set -euo pipefail
          {
            printf 'export K2S_TEST_PROXY=%q\n' "${K2S_CONFIG_HTTP_PROXY:-}"
            cat <<'EOF'
          set -euo pipefail
          export PATH="/usr/local/go/bin:$PATH"
          cd ~/k2s
          # The core suite reads /var/lib/k2s/setup.json, which is root-only, so the tests run as
          # root. The CI service does the same, with kubeadm's super-admin.conf as KUBECONFIG.
          proxy_args=()
          if [ -n "$K2S_TEST_PROXY" ]; then proxy_args=(--proxy "$K2S_TEST_PROXY"); fi
          sudo env "PATH=$PATH"             "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)"             KUBECONFIG=/etc/kubernetes/super-admin.conf             bash ./test/execute_all_tests.sh -v --tags sanity --test-result-path "$HOME/k2s-test-results" "${proxy_args[@]}"
          EOF
          } | $VM exec

      - name: Collect guest logs and results
        if: ${{ always() && steps.kvm.outputs.available == 'true' && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -uo pipefail
          mkdir -p ~/k2s-results-export
          if [ -d ~/k2s-test-results ]; then sudo cp -r ~/k2s-test-results/. ~/k2s-results-export/ && sudo chown -R "$(id -u):$(id -g)" ~/k2s-results-export; fi
          sudo cat /var/log/k2s.log > ~/k2s-results-export/k2s.log 2>/dev/null || echo 'no /var/log/k2s.log found'
          cd ~/k2s 2>/dev/null && sudo ./k2s status --output wide > ~/k2s-results-export/k2s-status.txt 2>&1
          sudo env KUBECONFIG=/etc/kubernetes/super-admin.conf kubectl get nodes -o wide > ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          sudo env KUBECONFIG=/etc/kubernetes/super-admin.conf kubectl get pods -A -o wide >> ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          sudo env KUBECONFIG=/etc/kubernetes/super-admin.conf kubectl get events -A --sort-by=.lastTimestamp >> ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          exit 0
          EOF
          mkdir -p "$RUNNER_TEMP"
          $VM pull k2s-results-export "$RUNNER_TEMP"

      - name: Uninstall K2s
        if: ${{ always() && steps.kvm.outputs.available == 'true' && steps.install.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s uninstall
          EOF

      - name: Upload test results
        if: ${{ always() && steps.kvm.outputs.available == 'true' && steps.install.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: linux-cluster-${{ github.run_id }}-${{ github.run_attempt }}-test-results
          path: ${{ runner.temp }}/k2s-results-export/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop guest
        if: ${{ always() && steps.kvm.outputs.available == 'true' && steps.vm.outcome != 'skipped' }}
        timeout-minutes: 5
        run: $VM stop
