#
# Removes the worker ($WK_NAME of the env script) with 'k2s node remove' and checks the result: the node is gone from
# the cluster and from /var/lib/k2s/cluster.json, and Kubernetes, CRI-O and their apt sources are gone from the worker.

name: Linux cluster node remove
description: Removes the worker with 'k2s node remove' and verifies the cleanup.

inputs:
  env-script:
    description: Script that defines cp_vm, wk_vm and WK_NAME, e.g. .github/scripts/linux-cluster-amd64-env.sh.
    required: true

runs:
  using: composite
  steps:
    - name: Remove the worker with k2s node remove
      shell: bash
      env:
        ENV_SCRIPT: ${{ inputs.env-script }}
      run: |
        set -euo pipefail
        source "$ENV_SCRIPT"
        {
          printf 'node=%q\n' "$WK_NAME"
          cat <<'EOF'
        set -euo pipefail
        cd ~/k2s
        sudo ./k2s node remove --name "$node" --output
        if sudo env KUBECONFIG=/etc/kubernetes/admin.conf kubectl get node "$node" >/dev/null 2>&1; then
          echo "::error::$node is still part of the cluster"; exit 1
        fi
        if sudo jq -e --arg name "$node" '.nodes // [] | any(.Name == $name)' /var/lib/k2s/cluster.json >/dev/null; then
          echo "::error::$node is still in /var/lib/k2s/cluster.json"; exit 1
        fi
        EOF
        } | cp_vm exec

    - name: Check the worker is cleaned up
      shell: bash
      env:
        ENV_SCRIPT: ${{ inputs.env-script }}
      run: |
        set -euo pipefail
        source "$ENV_SCRIPT"
        wk_vm exec <<'EOF'
        set -euo pipefail
        for tool in kubelet kubeadm crio; do
          if command -v "$tool" >/dev/null; then echo "::error::$tool is still installed on the worker"; exit 1; fi
        done
        for file in /etc/kubernetes/kubelet.conf /etc/apt/sources.list.d/kubernetes.list /etc/apt/sources.list.d/cri-o.list; do
          test ! -e "$file" || { echo "::error::$file is still on the worker"; exit 1; }
        done
        EOF
