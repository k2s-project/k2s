# Linux-host counterpart of ci-windows-cluster.yml for the experimental Linux host variant
# (the "reverted setup": control plane runs natively on the host, amd64, Linux-only).
#
# Mirrors ci/tests/40-test-linuxonly.yaml from k2s-support: install with --linux-only, then run
# the sanity-tagged acceptance tests through test/execute_all_tests.sh (the same entry point the
# CI service uses).
#
# K2s' native Linux path requires a Debian 13 host (lib/modules/linux/cluster/lifecycle.sh), and
# GitHub-hosted runners have no Debian host image. The job therefore boots a Debian 13 amd64 KVM
# guest on the GitHub-hosted runner (.github/scripts/linux-cluster-vm.sh) and runs K2s inside it.
#
# Addon tests are not available on this variant yet. The addon input is kept for parity with the
# Windows workflow; any value other than "none" fails the run before anything is provisioned.

name: CI - Linux Cluster

# Never run untrusted pull-request code on an elevated self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon whose full test set would run after the core suite. Not yet supported on the Linux host; any value other than "none" fails the run.'
        type: choice
        required: true
        default: 'none'
        options:
          - none
          - autoscaling
          - dashboard
          - dicom
          - ingress/nginx-gw
          - ingress/traefik
          - logging
          - metrics
          - monitoring
          - registry
          - rollout/argocd
          - security
          - storage/ceph
          - storage/smb
          - viewer
          - windows-exporter

permissions:
  contents: read

concurrency:
  group: k2s-linux-cluster
  cancel-in-progress: false

jobs:
  install-and-test:
    name: Install and test Linux-host cluster (Debian 13 amd64 guest)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      K2S_CONFIG_HTTP_PROXY: ${{ vars.K2S_HTTP_PROXY }}
      K2S_CONFIG_NO_PROXY: ${{ vars.K2S_NO_PROXY }}
      K2S_ADDON_SELECTION: ${{ inputs.addon }}
      # Invoked through bash: the script is committed without the executable bit.
      VM: bash .github/scripts/linux-cluster-vm.sh
    steps:
      - name: Reject addon selection (not yet supported on Linux host)
        run: |
          set -euo pipefail
          if [ "$K2S_ADDON_SELECTION" != "none" ]; then
            echo "::error::Addon tests ('$K2S_ADDON_SELECTION') are not available on the Linux host variant yet. Re-run with addon=none."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Check runner and enable KVM
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uname -m | grep -qx x86_64 || { echo "::error::Runner is not amd64: $(uname -m)"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm is not usable on this runner"; exit 1; }

      - name: Free runner disk space for the guest image
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Preinstalled toolchains that this job never uses. Setup-go installs into hostedtoolcache,
          # which is kept.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false

      - name: Build k2s CLI (linux/amd64)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o k2s ./cmd/k2s
          file k2s | grep -q 'ELF 64-bit' || { echo "::error::k2s is not a linux/amd64 ELF binary"; exit 1; }

      - name: Start Debian 13 guest
        id: vm
        timeout-minutes: 30
        run: |
          set -euo pipefail
          $VM prepare
          $VM start
          $VM wait-ssh

      - name: Prepare guest (Go toolchain and source tree)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          go_version=$(awk '/^go /{print $2}' go.mod)
          {
            printf 'GO_VERSION=%q\n' "$go_version"
            cat <<'EOF'
          cloud-init status --wait || echo 'cloud-init reported errors; continuing'
          if [ ! -x /usr/local/go/bin/go ]; then
            curl -fsSL --retry 3 "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          fi
          /usr/local/go/bin/go version
          EOF
          } | $VM exec
          tar --exclude=.git -czf "$RUNNER_TEMP/k2s-src.tgz" .
          $VM push "$RUNNER_TEMP/k2s-src.tgz" k2s-src.tgz
          $VM exec <<'EOF'
          set -euo pipefail
          mkdir -p ~/k2s
          tar -xzf ~/k2s-src.tgz -C ~/k2s
          test -x ~/k2s/k2s
          EOF

      - name: Install K2s (Linux host, Linux-only, no Windows worker)
        id: install
        timeout-minutes: 120
        run: |
          set -euo pipefail
          {
            printf 'cd ~/k2s\n'
            printf 'sudo ./k2s install --linux-only --output'
            if [ -n "${K2S_CONFIG_HTTP_PROXY:-}" ]; then printf ' --proxy %q' "$K2S_CONFIG_HTTP_PROXY"; fi
            if [ -n "${K2S_CONFIG_NO_PROXY:-}" ]; then printf ' --no-proxy %q' "$K2S_CONFIG_NO_PROXY"; fi
            printf '\n'
          } | $VM exec

      - name: Verify node and system pods
        timeout-minutes: 25
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s status --output wide
          command -v kubectl >/dev/null || { echo 'kubectl is not on PATH for the guest user'; exit 1; }
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          node_count=$(kubectl get nodes -o json | jq '.items | length')
          linux_count=$(kubectl get nodes -l kubernetes.io/os=linux -o json | jq '.items | length')
          if [ "$node_count" -ne 1 ] || [ "$linux_count" -ne 1 ]; then
            echo "Expected exactly one Linux node (linux-only install), got $node_count nodes, $linux_count linux."
            exit 1
          fi
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          EOF

      - name: Run sanity acceptance tests (CI service parity)
        id: tests
        timeout-minutes: 100
        run: |
          set -euo pipefail
          {
            printf 'export K2S_TEST_PROXY=%q\n' "${K2S_CONFIG_HTTP_PROXY:-}"
            cat <<'EOF'
          set -euo pipefail
          cd ~/k2s
          # Same kubeconfig choice as the CI service: kubeadm's super-admin.conf, copied to a
          # user-readable file. test/execute_all_tests.sh uses KUBECONFIG when it is set.
          sudo cp /etc/kubernetes/super-admin.conf ~/k2s-super-admin.conf
          sudo chown "$(id -u):$(id -g)" ~/k2s-super-admin.conf
          chmod 600 ~/k2s-super-admin.conf
          export KUBECONFIG="$HOME/k2s-super-admin.conf"
          proxy_args=()
          if [ -n "$K2S_TEST_PROXY" ]; then proxy_args=(--proxy "$K2S_TEST_PROXY"); fi
          bash ./test/execute_all_tests.sh -v --tags sanity --test-result-path "$HOME/k2s-test-results" "${proxy_args[@]}"
          EOF
          } | $VM exec

      - name: Collect guest logs and results
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -uo pipefail
          mkdir -p ~/k2s-results-export
          if [ -d ~/k2s-test-results ]; then cp -r ~/k2s-test-results/. ~/k2s-results-export/; fi
          if [ -f ~/k2s-super-admin.conf ]; then export KUBECONFIG=~/k2s-super-admin.conf; fi
          sudo cat /var/log/k2s.log > ~/k2s-results-export/k2s.log 2>/dev/null || echo 'no /var/log/k2s.log found'
          cd ~/k2s 2>/dev/null && sudo ./k2s status --output wide > ~/k2s-results-export/k2s-status.txt 2>&1
          kubectl get nodes -o wide > ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          kubectl get pods -A -o wide >> ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          kubectl get events -A --sort-by=.lastTimestamp >> ~/k2s-results-export/cluster-diagnostics.txt 2>&1
          exit 0
          EOF
          mkdir -p "$RUNNER_TEMP"
          $VM pull k2s-results-export "$RUNNER_TEMP"

      - name: Uninstall K2s
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          $VM exec <<'EOF'
          set -euo pipefail
          cd ~/k2s
          sudo ./k2s uninstall
          EOF

      - name: Upload test results
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: linux-cluster-${{ github.run_id }}-${{ github.run_attempt }}-test-results
          path: ${{ runner.temp }}/k2s-results-export/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop guest
        if: ${{ always() && steps.vm.outcome != 'skipped' }}
        timeout-minutes: 5
        run: $VM stop
