apiVersion: v1
kind: ServiceAccount
metadata:
  name: k2s-kserve-certgen
  namespace: kserve
  labels:
    app.kubernetes.io/managed-by: k2s-kserve
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k2s-kserve-certgen
  namespace: kserve
  labels:
    app.kubernetes.io/managed-by: k2s-kserve
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["k2s-kserve-webhook-next"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k2s-kserve-certgen
  namespace: kserve
  labels:
    app.kubernetes.io/managed-by: k2s-kserve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k2s-kserve-certgen
subjects:
  - kind: ServiceAccount
    name: k2s-kserve-certgen
    namespace: kserve
